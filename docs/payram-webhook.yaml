openapi: 3.1.0
info:
  title: Payram Webhooks
  version: 0.0.1
  description: >
    OpenAPI 3.1 document for Payram → Merchant webhook events. Use this to
    implement your server's webhook endpoint. This file is not used for SDK codegen.
  contact:
    name: Payram Support
    url: https://docs.payram.com
    email: dev@payram.com
servers:
  - url: https://webhooks.payram.example
    description: Placeholder URL for merchant webhook listener implementations.
webhooks:
  paymentEvent:
    post:
      summary: Payram → Merchant payment lifecycle event
      description: >
        Payram sends this to your endpoint when payment status changes. Every request is signed:
        X-Payram-Signature is sha256=<hex HMAC-SHA256 of the raw body, keyed with the project API key>.
        A legacy API-KEY header carrying the key itself is still sent for older integrations.
        Amounts are decimal strings. The same event can be delivered more than once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
            examples:
              completed:
                value:
                  reference_id: ref_123
                  invoice_id: inv_456
                  customer_id: cust_789
                  customer_email: a@b.com
                  status: FILLED
                  amount: "49.99"
                  filled_amount_in_usd: "49.99"
                  currency: USDC
      responses:
        "200":
          description: Acknowledge receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
components:
  schemas:
    WebhookPayload:
      type: object
      properties:
        reference_id:
          type: string
        invoice_id:
          type: string
        customer_id:
          type: string
        customer_email:
          type: string
          format: email
        status:
          type: string
          enum: [OPEN, CANCELLED, FILLED, PARTIALLY_FILLED, OVER_FILLED, UNDEFINED]
        amount:
          type: string
          description: Decimal string
        filled_amount:
          type: string
          description: Decimal string
        filled_amount_in_usd:
          type: string
          description: Decimal string
        currency:
          type: string
          description: Crypto ticker, e.g. USDC
        timestamp:
          type: integer
          description: Unix seconds
        confirmation_current:
          type: integer
        confirmation_required:
          type: integer
        payment_info:
          type: array
          items:
            type: object
            properties:
              source_address: { type: string }
              transaction_hash: { type: string }
              destination_address: { type: string }
              block_number: { type: integer }
      additionalProperties: true
      required: [reference_id, status]
    WebhookAck:
      type: object
      properties:
        message:
          type: string
          example: Webhook received successfully
