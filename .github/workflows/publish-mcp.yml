name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*' # trigger on version tags like v1.0.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The DNS key can publish anything under com.payram/*, so it lives in this environment
    # (limited to v* tags), not in a repo-wide secret. A job only sees an environment secret
    # when it names the environment.
    environment: mcp-registry-publish
    steps:
      # Nothing in this job pushes or fetches, so the token is not left in .git/config for the
      # dependency install scripts and tests that run before the publisher.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Download server schema
        # Follow whatever schema server.json declares, so bumping it is a one-file change.
        run: curl -fL "$(jq -r '."$schema"' server.json)" -o /tmp/mcp-server-schema.json

      # ajv comes from yarn.lock (devDependency), not whatever npx resolves that day.
      - name: Validate server.json against schema
        run: node scripts/validate-server-json.mjs /tmp/mcp-server-schema.json server.json

      # This binary receives the DNS key, so it is pinned to one release and checked against the
      # SHA-256 in that release's registry_1.8.1_checksums.txt before it runs:
      # https://github.com/modelcontextprotocol/registry/releases/tag/v1.8.1
      # To upgrade, change both values from the new release's checksums file.
      # It is fetched and checked last, right before it is used, so nothing that
      # runs earlier in the job can swap it.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc # linux_amd64
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # com.payram/* is proven by the MCPv1 TXT record on the payram.com apex,
      # so publishing needs that key rather than a GitHub identity.
      - name: Authenticate to MCP Registry (payram.com DNS proof)
        run: ./mcp-publisher login dns --domain=payram.com --private-key="$DNS_KEY"
        env:
          DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
