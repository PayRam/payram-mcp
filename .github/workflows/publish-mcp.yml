name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*' # trigger on version tags like v1.0.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Download server schema
        # Follow whatever schema server.json declares, so bumping it is a one-file change.
        run: curl -fL "$(jq -r '."$schema"' server.json)" -o /tmp/mcp-server-schema.json

      - name: Validate server.json against schema
        run: npx ajv-cli@5 validate -s /tmp/mcp-server-schema.json -d server.json --strict=false

      # com.payram/* is proven by the MCPv1 TXT record on the payram.com apex,
      # so publishing needs that key rather than a GitHub identity.
      - name: Authenticate to MCP Registry (payram.com DNS proof)
        run: ./mcp-publisher login dns --domain=payram.com --private-key="$DNS_KEY"
        env:
          DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
